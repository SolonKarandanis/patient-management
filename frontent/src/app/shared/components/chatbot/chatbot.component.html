<!-- Floating trigger button -->
<button
  hlmBtn
  type="button"
  class="chatbot-fab rounded-full"
  (click)="openPanel()"
  aria-label="Open support chat"
>
  <ng-icon name="lucideMessageCircle" />
</button>

<!-- Chat sheet -->
<hlm-sheet
  side="right"
  [state]="chatbotService.isOpen() ? 'open' : 'closed'"
  (stateChanged)="handleSheetStateChanged($event)"
>
  <hlm-sheet-content *hlmSheetPortal class="sm:max-w-[380px] flex flex-col">
    <hlm-sheet-header>
      <div class="chatbot-header">
        <span hlmSheetTitle class="chatbot-title">
          <ng-icon name="lucideMessageCircle" /> Support Assistant
        </span>
        <button
          hlmBtn
          variant="ghost"
          size="icon-sm"
          type="button"
          aria-label="Clear conversation"
          (click)="chatbotService.clearSession()"
        >
          <ng-icon name="lucideTrash2" />
        </button>
      </div>
    </hlm-sheet-header>

    <!-- Message list -->
    <div class="chatbot-messages px-4" #messageContainer>
      @if (chatbotService.messages().length === 0) {
        <div class="chatbot-empty">
          <ng-icon name="lucideMessageCircle" class="chatbot-empty-icon" />
          <p>Hi! How can I help you today?</p>
        </div>
      }

      @for (msg of chatbotService.messages(); track $index) {
        <div class="chatbot-message" [class.chatbot-message--user]="msg.role === 'user'" [class.chatbot-message--assistant]="msg.role === 'assistant'">
          <div class="chatbot-bubble">{{ msg.content }}</div>
        </div>
      }

      @if (chatbotService.isLoading()) {
        <div class="chatbot-message chatbot-message--assistant">
          <div class="chatbot-bubble chatbot-bubble--loading">
            <hlm-spinner class="text-lg" />
          </div>
        </div>
      }

      @if (chatbotService.error()) {
        <div class="chatbot-error">{{ chatbotService.error() }}</div>
      }
    </div>

    <!-- Input area -->
    <hlm-sheet-footer>
      <div class="chatbot-input-area">
        <input
          hlmInput
          type="text"
          placeholder="Type a message…"
          [ngModel]="inputText()"
          (ngModelChange)="inputText.set($event)"
          (keydown)="onKeydown($event)"
          [disabled]="chatbotService.isLoading()"
          class="chatbot-input"
          autocomplete="off"
        />
        <button
          hlmBtn
          size="icon"
          type="button"
          [disabled]="!inputText().trim() || chatbotService.isLoading()"
          (click)="send()"
          aria-label="Send"
        >
          <ng-icon name="lucideSend" />
        </button>
      </div>
    </hlm-sheet-footer>
  </hlm-sheet-content>
</hlm-sheet>
